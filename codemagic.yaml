workflows:
  ios-testflight:
    name: Bombay Suiting & Shirting iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: bombay_app_store_connect

    environment:
      ios_signing:
        distribution_type: app_store     
        bundle_identifier: com.bombaysuiting.billing
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync Capacitor iOS project
        script: npm run cap:sync
      - name: Apply iOS code signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: >-
          xcode-project build-ipa
          --project "$XCODE_PROJECT"
          --scheme "$XCODE_SCHEME"
          --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
