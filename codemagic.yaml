workflows:
  android-apk:
    name: Bombay Suiting & Shirting Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22
      java: 21

    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync Capacitor Android project
        script: npm run cap:sync
      - name: Configure Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build installable Android debug APK
        script: |
          cd android
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
